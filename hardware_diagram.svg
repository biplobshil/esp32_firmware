<svg viewBox="0 0 1100 780" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .box { fill: #ffffff; stroke: #333333; stroke-width: 2; }
    .esp32 { fill: #eef6fc; stroke: #1fa3ec; stroke-width: 2.5; }
    .plc { fill: #fdecec; stroke: #dc3545; stroke-width: 2.5; }
    .max485 { fill: #fff8e5; stroke: #e0a800; stroke-width: 2.5; }
    .led-red { fill: #dc3545; }
    .led-blue { fill: #1fa3ec; }
    .led-green { fill: #28a745; }
    .title { font-size: 20px; font-weight: bold; fill: #222222; }
    .label { font-size: 13px; fill: #222222; }
    .pin { font-size: 12px; fill: #555555; }
    .small { font-size: 11px; fill: #777777; }
    .wire-rs485 { stroke: #1fa3ec; stroke-width: 2; fill: none; }
    .wire-signal { stroke: #28a745; stroke-width: 2; fill: none; }
    .wire-gnd { stroke: #333333; stroke-width: 2; fill: none; }
    .wire-power { stroke: #dc3545; stroke-width: 2; fill: none; }
  </style>

  <text x="20" y="30" class="title">ESP32 PLC Boiler Economizer Monitor — Hardware Wiring</text>

  <!-- PLC -->
  <rect x="20" y="330" width="150" height="110" rx="6" class="plc"/>
  <text x="95" y="365" class="label" text-anchor="middle" font-weight="bold">PLC</text>
  <text x="95" y="382" class="small" text-anchor="middle">(Modbus RTU Slave)</text>
  <text x="30" y="405" class="pin">A ●</text>
  <text x="30" y="422" class="pin">B ●</text>
  <text x="95" y="405" class="pin" text-anchor="middle">Trigger ●</text>
  <text x="95" y="420" class="small" text-anchor="middle">(output)</text>

  <!-- MAX485 -->
  <rect x="260" y="300" width="150" height="170" rx="6" class="max485"/>
  <text x="335" y="325" class="label" text-anchor="middle" font-weight="bold">MAX485</text>
  <text x="335" y="341" class="small" text-anchor="middle">(RS485 transceiver)</text>
  <text x="270" y="365" class="pin">A ●</text>
  <text x="270" y="385" class="pin">B ●</text>
  <text x="330" y="405" class="pin">DI ●</text>
  <text x="330" y="425" class="pin">RO ●</text>
  <text x="330" y="445" class="pin">DE/RE ●</text>

  <!-- ESP32 board -->
  <rect x="470" y="80" width="220" height="640" rx="10" class="esp32"/>
  <text x="580" y="115" class="title" text-anchor="middle" font-size="18">ESP32</text>
  <text x="580" y="135" class="small" text-anchor="middle">30-pin dev board</text>

  <!-- ESP32 left-side pins (to MAX485) -->
  <text x="480" y="490" class="pin">GPIO1 (TX0) ●</text>
  <text x="480" y="510" class="pin">GPIO3 (RX0) ●</text>
  <text x="480" y="530" class="pin">GPIO17 ●</text>

  <!-- ESP32 right-side pins -->
  <text x="680" y="200" class="pin" text-anchor="end">● GPIO4 (Trigger)</text>
  <text x="680" y="240" class="pin" text-anchor="end">● GPIO0 (BOOT, onboard)</text>
  <text x="680" y="280" class="pin" text-anchor="end">● GPIO5 (WiFi Reset btn)</text>
  <text x="680" y="340" class="pin" text-anchor="end">● GPIO16 (WiFi LED)</text>
  <text x="680" y="380" class="pin" text-anchor="end">● GPIO18 (Reset LED)</text>
  <text x="680" y="420" class="pin" text-anchor="end">● GPIO19 (Modbus LED)</text>
  <text x="680" y="600" class="pin" text-anchor="end">● 3V3 / VIN</text>
  <text x="680" y="630" class="pin" text-anchor="end">● GND</text>

  <!-- RS485 wires: PLC <-> MAX485 -->
  <path class="wire-rs485" d="M 170 400 L 260 365"/>
  <path class="wire-rs485" d="M 170 417 L 260 385"/>
  <text x="200" y="373" class="small">A</text>
  <text x="200" y="410" class="small">B</text>

  <!-- MAX485 <-> ESP32 UART/DE-RE -->
  <path class="wire-rs485" d="M 410 405 L 445 405 L 445 490 L 470 490"/>
  <path class="wire-rs485" d="M 410 425 L 455 425 L 455 510 L 470 510"/>
  <path class="wire-rs485" d="M 410 445 L 465 445 L 465 530 L 470 530"/>
  <text x="415" y="398" class="small">DI→TX0</text>
  <text x="415" y="418" class="small">RO→RX0</text>
  <text x="415" y="438" class="small">DE/RE</text>

  <!-- PLC trigger -> ESP32 GPIO4 -->
  <path class="wire-signal" d="M 170 395 L 220 395 L 220 200 L 470 200"/>
  <text x="230" y="195" class="small">Trigger (active LOW)</text>

  <!-- WiFi reset button -->
  <rect x="760" y="255" width="150" height="55" rx="6" class="box"/>
  <text x="835" y="278" class="label" text-anchor="middle" font-weight="bold">WiFi Reset</text>
  <text x="835" y="295" class="small" text-anchor="middle">momentary button</text>
  <path class="wire-signal" d="M 680 280 L 760 280"/>
  <path class="wire-gnd" d="M 835 310 L 835 700 L 690 700 L 690 630"/>

  <!-- LEDs -->
  <!-- WiFi LED -->
  <circle cx="800" cy="340" r="12" class="led-blue"/>
  <text x="820" y="345" class="label">WiFi status LED</text>
  <path class="wire-signal" d="M 680 340 L 788 340"/>
  <path class="wire-gnd" d="M 800 352 L 800 700 L 690 700"/>
  <text x="820" y="360" class="small">via ~270Ω resistor</text>

  <!-- WiFi Reset LED -->
  <circle cx="800" cy="380" r="12" class="led-red"/>
  <text x="820" y="385" class="label">WiFi reset LED</text>
  <path class="wire-signal" d="M 680 380 L 788 380"/>
  <path class="wire-gnd" d="M 800 392 L 800 700"/>
  <text x="820" y="400" class="small">via ~270Ω resistor</text>

  <!-- Modbus LED -->
  <circle cx="800" cy="420" r="12" class="led-green"/>
  <text x="820" y="425" class="label">Modbus LED</text>
  <path class="wire-signal" d="M 680 420 L 788 420"/>
  <path class="wire-gnd" d="M 800 432 L 800 700"/>
  <text x="820" y="440" class="small">via ~270Ω resistor</text>

  <!-- Power -->
  <rect x="760" y="580" width="150" height="70" rx="6" class="box"/>
  <text x="835" y="605" class="label" text-anchor="middle" font-weight="bold">Power</text>
  <text x="835" y="622" class="small" text-anchor="middle">USB 5V or external</text>
  <text x="835" y="638" class="small" text-anchor="middle">supply to VIN</text>
  <path class="wire-power" d="M 680 600 L 760 600"/>
  <path class="wire-gnd" d="M 680 630 L 760 630"/>

  <!-- Legend -->
  <text x="20" y="500" class="label" font-weight="bold">Legend</text>
  <line x1="20" y1="515" x2="60" y2="515" class="wire-rs485"/>
  <text x="70" y="519" class="small">RS485 (A/B, DI/RO, DE-RE)</text>
  <line x1="20" y1="535" x2="60" y2="535" class="wire-signal"/>
  <text x="70" y="539" class="small">Digital signal (trigger, buttons, LEDs)</text>
  <line x1="20" y1="555" x2="60" y2="555" class="wire-gnd"/>
  <text x="70" y="559" class="small">GND / common return</text>
  <line x1="20" y1="575" x2="60" y2="575" class="wire-power"/>
  <text x="70" y="579" class="small">Power (5V / VIN)</text>

  <!-- Notes -->
  <text x="20" y="620" class="label" font-weight="bold">Notes</text>
  <text x="20" y="640" class="small">• GPIO1/GPIO3 double as USB-Serial pins — Serial.print() debug output may</text>
  <text x="20" y="655" class="small">  behave oddly while Modbus (Serial2) traffic is active on the same physical pins.</text>
  <text x="20" y="675" class="small">• All buttons use internal pull-ups (INPUT_PULLUP) — wire the other side to GND.</text>
  <text x="20" y="695" class="small">• All LEDs need a current-limiting resistor (~220–330Ω) in series to GND.</text>
</svg>
